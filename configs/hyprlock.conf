# Sovereign Hyprlock — Glassmorphism Theme
# Catppuccin Mocha + Material You (Cyan/Purple)
# AMD RX 7700 XT / 180Hz optimized

general {
    hide_cursor     = true
    grace           = 0
    no_fade_in      = false
    no_fade_out     = false
    ignore_empty_input = false
}

# ── Arka Plan ───────────────────────────────────────────────────────────────
background {
    monitor     =
    path        = screenshot  # kilit anındaki ekranı yakalar
    color       = rgba(1e1e2eff)

    blur_passes = 4
    blur_size   = 7
    noise       = 0.02
    contrast    = 0.9
    brightness  = 0.7
    vibrancy    = 0.2
    vibrancy_darkness = 0.5
}

# ── Saat ────────────────────────────────────────────────────────────────────
label {
    monitor =
    text    = cmd[update:1000] echo "<b>$(date '+%H:%M')</b>"
    color   = rgba(cdd6f4ff)
    font_size   = 88
    font_family = "JetBrains Mono Nerd Font"
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = rgba(1a1a2eaa)

    position = 0, 160
    halign   = center
    valign   = center
}

# ── Tarih ───────────────────────────────────────────────────────────────────
label {
    monitor =
    text    = cmd[update:60000] echo "$(date '+%A, %d %B %Y')"
    color   = rgba(bac2deff)
    font_size   = 22
    font_family = "JetBrains Mono Nerd Font"
    shadow_passes = 1
    shadow_color  = rgba(1a1a2eaa)

    position = 0, 60
    halign   = center
    valign   = center
}

# ── Şifre Alanı ─────────────────────────────────────────────────────────────
input-field {
    monitor =
    size    = 340, 56

    # Glassmorphism görünüm
    outline_thickness   = 2
    dots_size           = 0.28
    dots_spacing        = 0.18
    dots_center         = true
    dots_rounding       = -1

    # Renkler
    outer_color  = rgba(7dcfffcc) rgba(c27afacc) 45deg  # Cyan→Purple gradient
    inner_color  = rgba(313244cc)                        # surface0 + şeffaf
    font_color   = rgba(cdd6f4ff)
    check_color  = rgba(a6e3a1ff)                        # green — şifre doğru
    fail_color   = rgba(f38ba8ff)                        # red — şifre yanlış
    fade_on_empty   = true
    fade_timeout    = 1200

    placeholder_text = <span foreground="##6c7086">şifre...</span>
    fail_text        = <b>$PAMFAIL</b>

    rounding    = 14
    shadow_passes = 2
    shadow_size   = 12
    shadow_color  = rgba(1a1a2eaa)

    position    = 0, -40
    halign      = center
    valign      = center
}

# ── Kullanıcı ────────────────────────────────────────────────────────────────
label {
    monitor =
    text    = $USER
    color   = rgba(9399b2ff)
    font_size   = 14
    font_family = "JetBrains Mono Nerd Font"

    position = 0, -108
    halign   = center
    valign   = center
}
