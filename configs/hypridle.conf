# Sovereign Hypridle — Idle Management
# hyprlock ile entegre, UWSM uyumlu

general {
    lock_cmd        = pidof hyprlock || hyprlock  # zaten açıksa ikinci kez açma
    before_sleep_cmd = loginctl lock-session       # uyku öncesi kilitle
    after_sleep_cmd  = hyprctl dispatch dpms on    # uyanışta ekranı aç
    ignore_dbus_inhibit = false
}

# 5 dk — Ekran kararır (brightness %20'ye düşer)
listener {
    timeout  = 300
    on-timeout  = brightnessctl -s set 20%
    on-resume   = brightnessctl -r
}

# 10 dk — Ekran kilidi (hyprlock)
listener {
    timeout  = 600
    on-timeout  = loginctl lock-session
}

# 12 dk — Ekran kapatılır (DPMS off)
listener {
    timeout  = 720
    on-timeout  = hyprctl dispatch dpms off
    on-resume   = hyprctl dispatch dpms on
}

# 30 dk — Sistem uyku moduna girer
listener {
    timeout  = 1800
    on-timeout  = systemctl suspend
}
